services:
  db:
    image: postgres:16
    container_name: ourtdev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ourtdev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ourtdev_pgdata:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ourtdev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ourtdev_pgdata:
